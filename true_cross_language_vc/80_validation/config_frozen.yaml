# Frozen Synthesis and Evaluation Configuration for 80-File True Cross-Language Validation
experiment_name: "80_file_true_cross_language_validation"
random_seed: 42

cohort:
  total_files: 80
  spanish_hc: 20
  spanish_pd: 20
  german_hc: 20
  german_pd: 20

spanish_to_german:
  model: "Coqui XTTS-v2"
  checkpoint: "tts_models/multilingual/multi-dataset/xtts_v2"
  coqui_tts_version: "0.22.0"
  chunking_strategy: "S3_semantic_4chunk"
  num_chunks: 4
  reference_strategy: "R2_clean_15s_voiced_reference"
  reference_duration_target_sec: 15.0
  boundary_fade_ms: 25
  temperature: 0.65
  repetition_penalty: 3.5
  top_p: 0.85
  speed: 1.00
  target_language_code: "de"
  inter_chunk_silence_gap_sec: 0.20
  peak_normalization: 0.95

german_to_spanish:
  model: "Coqui XTTS-v2"
  checkpoint: "tts_models/multilingual/multi-dataset/xtts_v2"
  coqui_tts_version: "0.22.0"
  chunking_strategy: "sentence_segmented"
  num_sentences: 5
  reference_strategy: "R1_clean_10s_voiced_reference"
  reference_duration_target_sec: 10.0
  boundary_fade_ms: 25
  temperature: 0.75
  repetition_penalty: 2.0
  top_p: 0.85
  speed: 1.00
  target_language_code: "es"
  inter_sentence_silence_gap_sec: 0.25
  peak_normalization: 0.95

evaluation:
  language_id:
    model: "openai/whisper-base"
    first_step_logits: true
    min_prob_threshold: 0.85
  content_accuracy:
    model: "openai/whisper-base"
    task: "transcribe"
    metrics: ["WER", "CER", "WIP"]
  speaker_similarity:
    model: "speechbrain/spkrec-ecapa-voxceleb"
    sampling_rate: 16000
    metric: "cosine_similarity"
    hard_rejection_gate: 0.40
  pd_classification:
    primary_extractor: "facebook/wav2vec2-large-xlsr-53"
    primary_layer: 11
    secondary_models: ["wav2vec2-base", "wavlm-base-plus"]
    classifiers: ["linear_svm", "logistic_regression"]
